[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "konte"
version = "0.1.0"
description = "Contextual RAG library with hybrid FAISS + BM25 retrieval and LLM-generated chunk context"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sergey Leksikov"}
]
keywords = ["rag", "retrieval", "contextual-retrieval", "llm", "embeddings", "faiss", "bm25"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "tiktoken>=0.5.0",
    "aiofiles>=24.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
ui = [
    "gradio>=5.0.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gradio>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "fastapi>=0.115.0",  # tests/unit/test_api.py imports konte.api
]
eval = [
    "deepeval",
]

[project.scripts]
konte = "konte.cli.app:main"

[project.urls]
Homepage = "https://github.com/leksikov/konte"
Repository = "https://github.com/leksikov/konte"
Issues = "https://github.com/leksikov/konte/issues"
Changelog = "https://github.com/leksikov/konte/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["konte*"]

[tool.setuptools.package-data]
konte = ["prompts/*.txt", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (mocks allowed)",
    "integration: Integration tests (real API calls)",
    "e2e: End-to-end tests (slow, real API calls, full workflows)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option/Argument in defaults is the standard Typer pattern
"konte/cli/app.py" = ["B008"]
"konte/api/app.py" = ["B008"]
